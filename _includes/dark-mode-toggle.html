<!-- Dark Mode Toggle Button -->
{% if site.darkmode.enable %}
<button type="button" id="darkModeToggle" class="darkmode-toggle {% if site.darkmode.position == 'bottom-left' %}position-bottom-left{% elsif site.darkmode.position == 'top-right' %}position-top-right{% elsif site.darkmode.position == 'top-left' %}position-top-left{% else %}position-bottom-right{% endif %}" title="切换明暗主题" aria-label="切换明暗主题">
    <span id="toggleIcon">🌙</span>
</button>

<script>
(function() {
    var toggleBtn = document.getElementById('darkModeToggle');
    var toggleIcon = document.getElementById('toggleIcon');
    var htmlEl = document.documentElement;

    // The theme itself is applied by the inline script in <head>, before first paint.
    // This block only handles the interaction and keeps the icon in sync.
    function currentTheme() {
        return htmlEl.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }

    function syncIcon(theme) {
        toggleIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    function applyTheme(theme) {
        htmlEl.setAttribute('data-theme', theme);
        syncIcon(theme);
        try {
            localStorage.setItem('theme', theme);
        } catch (e) {
            /* storage unavailable: theme still applies for this page view */
        }
        // 通知需要按主题重绘的组件（例如标签云，颜色是 JS 内联写死的）
        try {
            document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: theme } }));
        } catch (e) {
            /* 老浏览器不支持 CustomEvent：主题仍然切换，只是组件不会重绘 */
        }
    }

    syncIcon(currentTheme());

    // Toggle on click
    toggleBtn.addEventListener('click', function() {
        applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
    });

    // Keyboard shortcut: Alt+D to toggle
    document.addEventListener('keydown', function(e) {
        if (e.altKey && e.key === 'd') {
            e.preventDefault();
            applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
        }
    });
})();
</script>
{% endif %}
